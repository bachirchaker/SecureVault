server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false # set to true in production behind HTTPS
        name: SECUREVAULT_SESSION

spring:
  application:
    name: SecureVault
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/securevault_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate # Flyway manages schema
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

# SecureVault Security and Cryptography Configuration
vault:
  encryption:
    # 256-bit AES master key represented in hex (32 bytes = 64 hex characters)
    # In production, MUST be provided via VAULT_MASTER_KEY environment variable
    master-key: ${VAULT_MASTER_KEY:4f9a7b2c6d8e0f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d5e7f9a}
    algorithm: AES
    cipher: AES/GCM/NoPadding
    tag-length-bits: 128
    nonce-length-bytes: 12
  security:
    max-failed-attempts: 5
    lockout-duration-minutes: 15
    argon2:
      iterations: 3
      memory-kb: 65536
      parallelism: 1
      salt-length: 16
      hash-length: 32

logging:
  level:
    root: INFO
    com.securevault: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: ERROR
