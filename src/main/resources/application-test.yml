spring:
  datasource:
    url: jdbc:h2:mem:securevault_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

vault:
  encryption:
    master-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    algorithm: AES
    cipher: AES/GCM/NoPadding
    tag-length-bits: 128
    nonce-length-bytes: 12
  security:
    max-failed-attempts: 5
    lockout-duration-minutes: 15

logging:
  level:
    root: WARN
    com.securevault: INFO
