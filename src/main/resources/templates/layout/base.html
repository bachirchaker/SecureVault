<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${pageTitle != null ? pageTitle + ' | SecureVault' : 'SecureVault - Enterprise Password Manager'}">SecureVault</title>
    
    <!-- Bootstrap 5 CSS & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom SecureVault SaaS Dark Cyber Theme -->
    <link rel="stylesheet" th:href="@{/css/securevault.css}">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sv-sidebar">
        <div class="sv-brand">
            <div class="sv-brand-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <div>
                <span class="d-block" style="line-height: 1.1;">SecureVault</span>
                <span class="badge badge-info" style="font-size: 0.65rem; letter-spacing: 0.05em;">ENTERPRISE</span>
            </div>
        </div>

        <nav class="sv-nav">
            <a th:href="@{/dashboard}" class="sv-nav-link" th:classappend="${pageTitle == 'Dashboard' ? 'active' : ''}">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/vault}" class="sv-nav-link" th:classappend="${pageTitle == 'Vault Credentials' ? 'active' : ''}">
                <i class="bi bi-safe2-fill"></i>
                <span>Vault Credentials</span>
            </a>
            <a th:href="@{/audit}" class="sv-nav-link" th:classappend="${pageTitle == 'Security Audit' ? 'active' : ''}">
                <i class="bi bi-activity"></i>
                <span>Security Audit</span>
            </a>
            <a th:href="@{/profile}" class="sv-nav-link" th:classappend="${pageTitle == 'Profile & Keys' ? 'active' : ''}">
                <i class="bi bi-person-gear"></i>
                <span>Profile & Keys</span>
            </a>

            <div class="mt-4 pt-3 border-top border-secondary border-opacity-10 px-2">
                <div class="text-uppercase text-secondary fw-semibold mb-2" style="font-size: 0.7rem; letter-spacing: 0.05em;">Security Tools</div>
                <button type="button" class="btn btn-secondary w-100 text-start d-flex align-items-center gap-2 mb-2 py-2" data-bs-toggle="modal" data-bs-target="#generatorModal">
                    <i class="bi bi-key-fill text-info"></i>
                    <span style="font-size: 0.85rem;">Password Generator</span>
                </button>
            </div>
        </nav>

        <!-- User Profile Pill -->
        <div class="sv-user-profile d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2 text-truncate">
                <div class="rounded-circle bg-primary bg-opacity-25 text-info d-flex align-items-center justify-content-center fw-bold" style="width: 32px; height: 32px; font-size: 0.85rem;">
                    <i class="bi bi-person"></i>
                </div>
                <div class="text-truncate" style="line-height: 1.2;">
                    <span class="d-block text-white fw-semibold small text-truncate" sec:authentication="name">User</span>
                    <span class="text-secondary" style="font-size: 0.725rem;"><i class="bi bi-shield-check text-success me-1"></i>AES-GCM</span>
                </div>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-link text-secondary p-1" title="Secure Logout">
                    <i class="bi bi-box-arrow-right fs-5"></i>
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content Container -->
    <div class="sv-main">
        <!-- Mobile Topbar Toggle -->
        <div class="d-lg-none d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom border-secondary border-opacity-10">
            <div class="d-flex align-items-center gap-2">
                <div class="sv-brand-icon" style="width: 32px; height: 32px; font-size: 1rem;">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <span class="fw-bold">SecureVault</span>
            </div>
            <button id="sidebar-toggle" class="btn btn-secondary btn-sm">
                <i class="bi bi-list fs-5"></i>
            </button>
        </div>

        <!-- Global Flash Alerts -->
        <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center gap-2 alert-dismissible fade show" role="alert" style="background-color: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); color: #34d399;">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}">Operation completed successfully.</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center gap-2 alert-dismissible fade show" role="alert" style="background-color: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #f87171;">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}">An error occurred.</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Page Specific Body Content -->
        <div th:replace="${content}"></div>
    </div>

    <!-- Global Password Generator Modal -->
    <div class="modal fade" id="generatorModal" tabindex="-1" aria-labelledby="generatorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title d-flex align-items-center gap-2" id="generatorModalLabel">
                        <i class="bi bi-cpu text-info"></i> Cryptographic Password Generator
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Generated Secret</label>
                        <div class="input-group">
                            <input type="text" id="gen-result-display" class="form-control font-monospace" readonly placeholder="Click Generate...">
                            <button class="btn btn-secondary" type="button" data-copy-target="gen-result-display" title="Copy to clipboard">
                                <i class="bi bi-clipboard"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <label for="gen-length-slider" class="form-label mb-0">Password Length</label>
                            <span id="gen-length-val" class="text-info fw-bold font-monospace">16</span>
                        </div>
                        <input type="range" class="form-range" id="gen-length-slider" min="8" max="64" value="16">
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="gen-opt-upper" checked>
                                <label class="form-check-label small" for="gen-opt-upper">Uppercase (A-Z)</label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="gen-opt-lower" checked>
                                <label class="form-check-label small" for="gen-opt-lower">Lowercase (a-z)</label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="gen-opt-numbers" checked>
                                <label class="form-check-label small" for="gen-opt-numbers">Numbers (0-9)</label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="gen-opt-symbols" checked>
                                <label class="form-check-label small" for="gen-opt-symbols">Special Symbols (!@#$)</label>
                            </div>
                        </div>
                        <div class="col-12 mt-2">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="gen-opt-ambiguous">
                                <label class="form-check-label small text-secondary" for="gen-opt-ambiguous">Avoid Ambiguous Characters (1, l, I, 0, O)</label>
                            </div>
                        </div>
                    </div>

                    <button type="button" id="btn-run-generate" class="btn btn-secondary w-100 mb-2">
                        <i class="bi bi-arrow-repeat me-1"></i> Generate New Password
                    </button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" id="btn-apply-generated" class="btn btn-primary">Apply to Entry</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/securevault.js}"></script>
</body>
</html>
