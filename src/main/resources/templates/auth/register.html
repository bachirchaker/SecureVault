<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Create Master Account | SecureVault</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/securevault.css}">
</head>
<body class="sv-auth-wrapper">

    <div class="sv-auth-card" style="max-width: 480px;">
        <div class="text-center mb-4">
            <div class="sv-brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.6rem;">
                <i class="bi bi-shield-check"></i>
            </div>
            <h2 class="fw-bold text-white mb-1">Create Vault Account</h2>
            <p class="text-secondary small mb-0">Initialize your personal encrypted security vault</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-3" role="alert" style="background-color: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #f87171;">
            <i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i>
            <span th:text="${errorMessage}">Registration error.</span>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="username" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username') ? 'is-invalid' : ''}" placeholder="Choose a username" required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username error</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" id="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}" placeholder="you@example.com" required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
            </div>

            <div class="mb-3">
                <label for="vault-password-input" class="form-label">Master Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                        <i class="bi bi-key"></i>
                    </span>
                    <input type="password" id="vault-password-input" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}" placeholder="Min 8 chars, mixed case, number & symbol" required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>
                
                <!-- Live strength meter -->
                <div class="strength-meter">
                    <div id="strength-bar" class="strength-meter-bar" style="width: 0%;"></div>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-1">
                    <span id="strength-label" class="small fw-semibold" style="font-size: 0.75rem;"></span>
                </div>
                <div id="strength-feedback"></div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Master Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                        <i class="bi bi-check2-circle"></i>
                    </span>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" th:classappend="${#fields.hasErrors('confirmPassword') ? 'is-invalid' : ''}" placeholder="Repeat master password" required>
                </div>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Password match error</div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3 py-2">
                <i class="bi bi-shield-lock me-1"></i> Register & Initialize Vault
            </button>
        </form>

        <div class="text-center pt-2 border-top border-secondary border-opacity-10">
            <span class="text-secondary small">Already have a vault? </span>
            <a th:href="@{/login}" class="text-info text-decoration-none small fw-semibold">Sign in</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/securevault.js}"></script>
</body>
</html>
