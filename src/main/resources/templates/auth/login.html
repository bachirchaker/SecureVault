<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SecureVault</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/securevault.css}">
</head>
<body class="sv-auth-wrapper">

    <div class="sv-auth-card">
        <div class="text-center mb-4">
            <div class="sv-brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.6rem;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2 class="fw-bold text-white mb-1">SecureVault</h2>
            <p class="text-secondary small mb-0">Enterprise Zero-Knowledge Password Architecture</p>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-3" role="alert" style="background-color: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #f87171;">
            <i class="bi bi-shield-exclamation fs-5 flex-shrink-0"></i>
            <span th:text="${errorMessage}">Authentication failed.</span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small d-flex align-items-center gap-2 mb-3" role="alert" style="background-color: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); color: #34d399;">
            <i class="bi bi-check-circle-fill fs-5 flex-shrink-0"></i>
            <span th:text="${successMessage}">Success.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="identifier" class="form-label">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="identifier" name="identifier" class="form-control" placeholder="admin or name@company.com" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label mb-0">Master Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                        <i class="bi bi-key"></i>
                    </span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3 py-2">
                <i class="bi bi-unlock-fill me-1"></i> Unlock Secure Vault
            </button>
        </form>

        <div class="text-center pt-2 border-top border-secondary border-opacity-10">
            <p class="text-secondary small mb-2">New to SecureVault?</p>
            <a th:href="@{/register}" class="btn btn-secondary btn-sm w-100">
                <i class="bi bi-person-plus me-1"></i> Create Secure Account
            </a>
        </div>

        <div class="mt-4 pt-2 text-center">
            <div class="d-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill bg-dark border border-secondary border-opacity-25" style="font-size: 0.72rem; color: #94a3b8;">
                <i class="bi bi-shield-check text-success"></i>
                <span>Protected by AES-256-GCM & Brute-Force Throttling</span>
            </div>
        </div>
    </div>

</body>
</html>
