<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | SecureVault</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/securevault.css}">
</head>
<body class="sv-auth-wrapper">

    <div class="sv-auth-card text-center" style="max-width: 500px;">
        <div class="mb-3 text-warning">
            <i class="bi bi-question-circle" style="font-size: 3.5rem;"></i>
        </div>
        <h1 class="display-5 fw-bold text-white mb-2">404</h1>
        <h4 class="fw-bold text-white mb-3" th:text="${errorTitle ?: 'Resource Not Found'}">Resource Not Found</h4>
        <p class="text-secondary small mb-4" th:text="${errorMessage ?: 'The requested URL or credential item does not exist or has been removed.'}">
            The requested URL or credential item does not exist or has been removed.
        </p>

        <a th:href="@{/dashboard}" class="btn btn-primary">
            <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
        </a>
    </div>

</body>
</html>
